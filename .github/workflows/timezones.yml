name: Timezone migration contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timezone-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ./.github/scripts/setup.sh
      - name: Verify reviewed app bodies
        run: python3 tests/timezone_source_equivalence.py
      - name: Evaluate timezone and sports contracts with networking denied
        run: |
          for test in standard_timezones sports_timezones sports_score_dates ncaaf_score_dates scoreboard_sequences sports_playback nfl_logo_assets college_logo_bundles content_playback; do
            sudo unshare --net python3 "tests/$test.py" /usr/local/bin/niblet
          done
